[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-pipeline"
version = "0.1.0"
description = "Structured risk intelligence pipeline (case study)"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.28,<2"]

[tool.setuptools.packages.find]
where = ["src"]